<main class="app">
  <section class="hero">
    <div class="badge">バッチ計算ツール</div>
    <h1>芸能人病気データ 一括計算</h1>
    <p>168名の芸能人データに対して算命学計算を実行し、結果をJSONとして出力します。</p>
  </section>

  <section class="panel input-panel">
    <h3 class="panel-title">一括計算と統計</h3>
    <div class="batch-actions">
      <button id="runBtn">計算実行</button>
      <button id="moteStatsBtn">人気度統計（異性・同性）</button>
      <button id="downloadBtn" style="display:none">結果をダウンロード</button>
    </div>
    <p class="note">「計算実行」で全員分の算命学結果を出力。「人気度統計」で異性・同性からの人気度の分布を確認できます。</p>
    <div id="status" class="batch-status" style="display:none"></div>
    <textarea id="output" class="batch-output" style="display:none" readonly></textarea>
  </section>
</main>

function calculateSanmeigaku(celeb) {
  const parts = celeb.birth_date.split("-").map(Number);
  const by = parts[0], bm = parts[1], bd = parts[2];
  const date = new Date(by, bm - 1, bd);
  const gender = celeb.gender;

  const year = getYearPillar(date);
  const month = getMonthPillar(date, stems.indexOf(year.stem));
  const day = getDayPillar(date);
  const pillars = { year, month, day };
  const allPillars = [year, month, day];

  const counts = countElements(allPillars);
  const balanceType = getBalanceType(counts);

  const daysSinceSetsuiri = getDaysSinceSetsuiri(date);
  const zoukan = {
    year: getZoukan(year.branch, daysSinceSetsuiri),
    month: getZoukan(month.branch, daysSinceSetsuiri),
    day: getZoukan(day.branch, daysSinceSetsuiri),
  };

  const mainStars = {
    north: getMainStar(day.stem, year.stem),
    south: getMainStar(day.stem, month.stem),
    east: getMainStar(day.stem, zoukan.year),
    west: getMainStar(day.stem, zoukan.day),
    center: getMainStar(day.stem, zoukan.month),
    companion: getMainStar(day.stem, stems[mod(stems.indexOf(year.stem) + 5, 10)]),
  };

  const energy = [
    getEnergyStar(day.stem, year.branch),
    getEnergyStar(day.stem, month.branch),
    getEnergyStar(day.stem, day.branch),
  ];

  const tenchusatsu = getTenchusatsu(day.index);
  const taiun = getTaiun(date, month, stems.indexOf(year.stem), gender);
  const topologyResults = analyzeTopology(pillars);
  const fateTenchu = analyzeFateTenchusatsu(pillars);
  const guardian = getGuardianElements(counts);

  // 発症年時のデータ
  const onsetYear = celeb.onset_year;
  const onsetAge = onsetYear - by;
  const onsetYp = getYearPillarForYear(onsetYear);
  const onsetYearStar = getMainStar(day.stem, onsetYp.stem);
  const onsetYearEnergy = getEnergyStar(day.stem, onsetYp.branch);
  const onsetIsTenchu = isTenchusatsuYear(onsetYp.branch, tenchusatsu);
  const onsetTaiun = taiun.periods.find(p => onsetAge >= p.age && onsetAge <= p.ageTo);
  const onsetTaiunStar = onsetTaiun ? getMainStar(day.stem, onsetTaiun.stem) : null;
  const onsetTaiunEnergy = onsetTaiun ? getEnergyStar(day.stem, onsetTaiun.branch) : null;
  const onsetIsTaiunTenchu = onsetTaiun ? isTenchusatsuYear(onsetTaiun.branch, tenchusatsu) : false;
  const onsetTopology = analyzeBranchTopology(onsetYp.branch, pillars);

  // 発症年の健康リスク
  const healthRisk = analyzeHealthRisk(day, pillars, counts, taiun, tenchusatsu, onsetAge, onsetYear);
  const onsetHealthRisk = healthRisk.yearRisks.find(r => r.year === onsetYear);

  // 姓名判断（last_name, first_nameを使用）
  let seimeiResult = null;
  if (celeb.last_name && celeb.first_name) {
    seimeiResult = analyzeSeimei(celeb.last_name, celeb.first_name);
    if (seimeiResult && seimeiResult.error) {
      seimeiResult = { error: seimeiResult.error, missingChars: seimeiResult.missingChars };
    }
  }

  const gogyoVals = Object.values(counts);
  const gogyoMax = Math.max(...gogyoVals);
  const gogyoMin = Math.min(...gogyoVals);
  const gogyoBalance = gogyoMax - gogyoMin;
  const gogyoEntries = Object.entries(counts);
  const strongestGogyo = gogyoEntries.filter(([, v]) => v === gogyoMax).map(([k]) => k);
  const weakestGogyo = gogyoEntries.filter(([, v]) => v === gogyoMin).map(([k]) => k);

  const mote = analyzeMote(mainStars, energy, counts, day, pillars);

  return {
    id: celeb.id,
    name: celeb.name,
    real_name: celeb.real_name,
    birth_date: celeb.birth_date,
    gender: celeb.gender,
    illness: celeb.illness,
    illness_category: celeb.illness_category,
    onset_year: celeb.onset_year,
    notes: celeb.notes,
    pillars: {
      year: year.stem + year.branch,
      month: month.stem + month.branch,
      day: day.stem + day.branch,
    },
    day_stem: day.stem,
    day_branch: day.branch,
    day_element: elements[stems.indexOf(day.stem)],
    day_yin_yang: yinYang[stems.indexOf(day.stem)],
    zoukan: zoukan,
    gogyo_counts: counts,
    gogyo_balance: gogyoBalance,
    balance_type: balanceType,
    strongest_gogyo: strongestGogyo,
    weakest_gogyo: weakestGogyo,
    main_stars: mainStars,
    energy_stars: energy.map(e => ({ name: e.name, score: e.score })),
    tenchusatsu: tenchusatsu,
    fate_tenchusatsu: fateTenchu,
    taiun: {
      start_age: taiun.startAge,
      forward: taiun.forward,
      periods: taiun.periods.map(p => ({
        age: p.age, ageTo: p.ageTo,
        pillar: p.stem + p.branch,
        stem: p.stem, branch: p.branch,
      })),
    },
    topology: topologyResults.map(r => ({ label: r.label, name: r.name, group: r.group })),
    guardian: guardian,
    onset_data: {
      age: onsetAge,
      year_pillar: onsetYp.stem + onsetYp.branch,
      year_star: onsetYearStar,
      year_energy: onsetYearEnergy ? { name: onsetYearEnergy.name, score: onsetYearEnergy.score } : null,
      is_tenchu_year: onsetIsTenchu,
      taiun: onsetTaiun ? {
        age_range: onsetTaiun.age + "-" + onsetTaiun.ageTo,
        pillar: onsetTaiun.stem + onsetTaiun.branch,
        stem: onsetTaiun.stem,
        branch: onsetTaiun.branch,
        star: onsetTaiunStar,
        energy: onsetTaiunEnergy ? { name: onsetTaiunEnergy.name, score: onsetTaiunEnergy.score } : null,
        is_tenchu: onsetIsTaiunTenchu,
      } : null,
      topology: onsetTopology.map(r => ({ label: r.label, name: r.name, group: r.group })),
      health_risk: onsetHealthRisk ? {
        risk_score: onsetHealthRisk.riskScore,
        level: onsetHealthRisk.level,
        factors: onsetHealthRisk.factors,
        major_diseases: onsetHealthRisk.majorDiseases,
      } : null,
    },
    health_risk_summary: {
      day_element: healthRisk.dayElement,
      constitution: healthRisk.constitution,
      natal_weakness: healthRisk.natalWeakness,
      natal_excess: healthRisk.natalExcess,
      major_disease_risks: healthRisk.majorDiseaseRisks.map(r => ({
        year: r.year, age: r.age, pillar: r.pillar,
        risk_score: r.riskScore, level: r.level, is_tenchu: r.isTenchu,
        major_diseases: r.majorDiseases,
      })),
    },
    seimei: seimeiResult && !seimeiResult.error ? {
      tenkaku: seimeiResult.tenkaku, jinkaku: seimeiResult.jinkaku,
      chikaku: seimeiResult.chikaku, soukaku: seimeiResult.soukaku,
      gaikaku: seimeiResult.gaikaku, sancai: seimeiResult.sancai,
      ten_rank: seimeiResult.tenRank?.rank, jin_rank: seimeiResult.jinRank?.rank,
      chi_rank: seimeiResult.chiRank?.rank, gai_rank: seimeiResult.gaiRank?.rank,
      sou_rank: seimeiResult.souRank?.rank,
      overall_rank: seimeiResult.overallRank,
    } : (seimeiResult && seimeiResult.error ? { error: seimeiResult.error } : null),
    mote: {
      opposite_score: mote.oppositeScore,
      same_score: mote.sameScore,
      opposite_rank: mote.oppositeRank.rank,
      same_rank: mote.sameRank.rank,
    },
  };
}

let lastResults = null;

document.getElementById("runBtn").addEventListener("click", function() {
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  status.style.display = "block";
  output.style.display = "none";
  status.textContent = "計算を開始します...\n";

  const results = [];
  for (const celeb of CELEB_DATA) {
    try {
      const result = calculateSanmeigaku(celeb);
      results.push(result);
      status.textContent += "[" + celeb.id + "] " + celeb.name + " - " + celeb.illness + " (発症:" + celeb.onset_year + "年) -> 完了\n";
    } catch (err) {
      status.textContent += "[" + celeb.id + "] " + celeb.name + " - エラー: " + err.message + "\n";
      results.push({ id: celeb.id, name: celeb.name, error: err.message });
    }
  }

  const success = results.filter(r => !r.error).length;
  const errors = results.filter(r => r.error).length;
  status.textContent += "\n計算完了! 成功:" + success + "名 / エラー:" + errors + "名\n";
  status.innerHTML += '<span class="done">結果を下のテキストエリアからコピーするか、ダウンロードボタンで保存してください。</span>';

  output.value = JSON.stringify(results, null, 2);
  output.style.display = "block";

  const dlBtn = document.getElementById("downloadBtn");
  dlBtn.style.display = "inline-block";

  lastResults = results;
});

document.getElementById("downloadBtn").addEventListener("click", function() {
  if (!lastResults) return;
  const blob = new Blob([JSON.stringify(lastResults, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "celebrity_sanmeigaku_results.json";
  a.click();
  URL.revokeObjectURL(url);
});

// === 人気度（モテ度）統計 ===
document.getElementById("moteStatsBtn").addEventListener("click", function() {
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  status.style.display = "block";
  output.style.display = "none";
  status.textContent = "人気度統計を計算中...\n";

  const records = [];
  for (const celeb of CELEB_DATA) {
    try {
      const parts = celeb.birth_date.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      const year = getYearPillar(date);
      const month = getMonthPillar(date, stems.indexOf(year.stem));
      const day = getDayPillar(date);
      const pillars = { year, month, day };
      const counts = countElements([year, month, day]);
      const daysSinceSetsuiri = getDaysSinceSetsuiri(date);
      const zoukan = {
        year: getZoukan(year.branch, daysSinceSetsuiri),
        month: getZoukan(month.branch, daysSinceSetsuiri),
        day: getZoukan(day.branch, daysSinceSetsuiri),
      };
      const mainStars = {
        north: getMainStar(day.stem, year.stem),
        south: getMainStar(day.stem, month.stem),
        east: getMainStar(day.stem, zoukan.year),
        west: getMainStar(day.stem, zoukan.day),
        center: getMainStar(day.stem, zoukan.month),
        companion: getMainStar(day.stem, stems[mod(stems.indexOf(year.stem) + 5, 10)]),
      };
      const energy = [
        getEnergyStar(day.stem, year.branch),
        getEnergyStar(day.stem, month.branch),
        getEnergyStar(day.stem, day.branch),
      ];
      const mote = analyzeMote(mainStars, energy, counts, day, pillars);
      records.push({
        name: celeb.name,
        gender: celeb.gender,
        opp: mote.oppositeScore,
        same: mote.sameScore,
        oppRank: mote.oppositeRank.rank,
        sameRank: mote.sameRank.rank,
      });
    } catch (err) {
      status.textContent += "[" + celeb.id + "] " + celeb.name + " - エラー: " + err.message + "\n";
    }
  }

  const stat = (arr) => {
    const sorted = [...arr].sort((a, b) => a - b);
    const n = sorted.length;
    const mean = arr.reduce((s, v) => s + v, 0) / n;
    const median = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
    const sd = Math.sqrt(arr.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
    return { n, mean: mean.toFixed(1), median, sd: sd.toFixed(1), min: sorted[0], max: sorted[n - 1] };
  };

  const rankDist = (arr) => {
    const dist = { S: 0, A: 0, B: 0, C: 0, D: 0 };
    arr.forEach(r => dist[r]++);
    return dist;
  };

  const histogram = (arr) => {
    const bins = {};
    arr.forEach(v => {
      const bin = Math.min(9, Math.floor(v / 10)) * 10;
      bins[bin] = (bins[bin] || 0) + 1;
    });
    let out = "";
    for (let b = 0; b <= 90; b += 10) {
      const cnt = bins[b] || 0;
      out += `  ${String(b).padStart(2)}〜${b + 9}点: ${"█".repeat(cnt)} ${cnt}名\n`;
    }
    return out;
  };

  const fmtRank = (d, n) => ["S", "A", "B", "C", "D"].map(r => `${r}:${d[r]}名(${(d[r] / n * 100).toFixed(1)}%)`).join(" / ");

  const oppAll = records.map(r => r.opp);
  const sameAll = records.map(r => r.same);
  const males = records.filter(r => r.gender === "male");
  const females = records.filter(r => r.gender === "female");

  const so = stat(oppAll);
  const ss = stat(sameAll);

  let out = "";
  out += "═══ 人気度チェック（異性から・同性から）統計 ═══\n";
  out += `対象: ${records.length}名（男性${males.length}名 / 女性${females.length}名）\n\n`;

  out += "【異性からの人気度】\n";
  out += `  平均: ${so.mean}点 / 中央値: ${so.median}点 / 標準偏差: ${so.sd} / 最小: ${so.min}点 / 最大: ${so.max}点\n`;
  out += `  ランク分布: ${fmtRank(rankDist(records.map(r => r.oppRank)), records.length)}\n`;
  out += histogram(oppAll) + "\n";

  out += "【同性からの人気度】\n";
  out += `  平均: ${ss.mean}点 / 中央値: ${ss.median}点 / 標準偏差: ${ss.sd} / 最小: ${ss.min}点 / 最大: ${ss.max}点\n`;
  out += `  ランク分布: ${fmtRank(rankDist(records.map(r => r.sameRank)), records.length)}\n`;
  out += histogram(sameAll) + "\n";

  out += "【男女別 平均】\n";
  if (males.length) {
    const mo = stat(males.map(r => r.opp));
    const ms = stat(males.map(r => r.same));
    out += `  男性: 異性から ${mo.mean}点 / 同性から ${ms.mean}点\n`;
  }
  if (females.length) {
    const fo = stat(females.map(r => r.opp));
    const fs = stat(females.map(r => r.same));
    out += `  女性: 異性から ${fo.mean}点 / 同性から ${fs.mean}点\n`;
  }
  out += "\n";

  const topOpp = [...records].sort((a, b) => b.opp - a.opp).slice(0, 10);
  const topSame = [...records].sort((a, b) => b.same - a.same).slice(0, 10);
  const lowOpp = [...records].sort((a, b) => a.opp - b.opp).slice(0, 10);

  out += "【異性からの人気度 TOP10】\n";
  topOpp.forEach((r, i) => { out += `  ${i + 1}. ${r.name} ${r.opp}点(${r.oppRank}) / 同性${r.same}点(${r.sameRank})\n`; });
  out += "\n【同性からの人気度 TOP10】\n";
  topSame.forEach((r, i) => { out += `  ${i + 1}. ${r.name} 同性${r.same}点(${r.sameRank}) / 異性${r.opp}点(${r.oppRank})\n`; });
  out += "\n【異性からの人気度 WORST10】\n";
  lowOpp.forEach((r, i) => { out += `  ${i + 1}. ${r.name} ${r.opp}点(${r.oppRank}) / 同性${r.same}点(${r.sameRank})\n`; });

  const corr = (() => {
    const n = records.length;
    const mx = oppAll.reduce((s, v) => s + v, 0) / n;
    const my = sameAll.reduce((s, v) => s + v, 0) / n;
    let num = 0, dx = 0, dy = 0;
    records.forEach(r => { num += (r.opp - mx) * (r.same - my); dx += (r.opp - mx) ** 2; dy += (r.same - my) ** 2; });
    return (num / Math.sqrt(dx * dy)).toFixed(3);
  })();
  out += `\n【異性スコアと同性スコアの相関係数】 r = ${corr}\n`;

  status.textContent = out;

  output.value = JSON.stringify(records, null, 2);
  output.style.display = "block";
});
</script>
